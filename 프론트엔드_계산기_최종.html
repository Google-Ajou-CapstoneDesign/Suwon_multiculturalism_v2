<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Bridge · 정밀 임금·체불 계산기 v6</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>

  --blue:#1E40AF; --teal:#0D9488; --amber:#D97706;

  --line:#E2E8F0; --cover-1:#1E3A6E; --cover-2:#132747; --foil:#E8C88A;
  --red:#DC2626;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Malgun Gothic",sans-serif;

}
.doc-head{max-width:900px;width:100%;text-align:center}

.phone{width:352px;height:740px;border-radius:40px;background:#000;padding:11px;

.screen{width:100%;height:100%;border-radius:30px;overflow:hidden;background:var(--paper);
  position:relative;display:flex;flex-direction:column}
.status{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;

.stage{position:relative;flex:1;overflow:hidden}
.view{position:absolute;inset:0;display:flex;flex-direction:column}

/* 위저드 공통 */

.wz-top .r1{display:flex;align-items:center;justify-content:space-between;gap:9px}
.wz-top h3{font-size:16.5px;font-weight:800;color:var(--ink);letter-spacing:-.025em}
.wz-top .stepno{font-size:10px;font-weight:700;color:#1D4ED8;background:#EEF3FE;padding:4px 9px;
  border-radius:20px;flex:none}
.wz-bar{display:flex;gap:4px;margin-top:10px}
.wz-bar i{flex:1;height:3px;border-radius:3px;background:#E2E8F0;display:block;transition:background .25s}
.wz-bar i.done{background:var(--teal)}
.wz-bar i.on{background:var(--blue)}
.wz-body{flex:1;overflow-y:auto;padding:14px 15px 18px;min-height:0}
.wz-body h4{font-size:15.5px;font-weight:800;color:var(--ink);letter-spacing:-.025em;line-height:1.35;display:flex;align-items:center}
.wz-body .lead{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.5;margin-bottom:12px}
.wz-foot{flex:none;padding:10px 15px 13px;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px}

.btn{flex:1;border:0;border-radius:11px;padding:13px;font-size:13px;font-weight:700;
  cursor:pointer;font-family:inherit}
.btn.pri{background:var(--blue);color:#fff}
.btn.gho{background:#F1F5F9;color:var(--ink-2);flex:0 0 92px}

/* 상단 50/50 불러오기 버튼 */
.top-imports{display:flex;gap:7px;margin-bottom:12px}
.top-imp-btn{flex:1;background:#EEF2FF;border:1px solid #C7D2FE;color:#3730A3;font-size:11px;font-weight:700;
  padding:9px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;font-family:inherit}
.top-imp-btn:active{background:#E0E7FF}
.top-imp-btn:disabled{opacity:.55;cursor:wait}

.seg{display:flex;background:#F1F5F9;border-radius:11px;padding:3px;margin-bottom:9px}
.seg button{flex:1;border:0;background:none;font-family:inherit;font-size:11.5px;font-weight:700;
  color:var(--ink-3);padding:8px 4px;border-radius:9px;cursor:pointer;transition:background .18s,color .18s}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 1px 4px rgba(15,23,42,.12)}

.fgroup{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:11px}
.fgroup h5{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px;display:flex;align-items:center}
.frow{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.frow:last-child{margin-bottom:0}
.frow label{flex:1;font-size:12px;color:#334155;line-height:1.4;display:flex;align-items:center}

.frow input{width:104px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;

.frow input:focus{outline:2px solid #BFD4FB;outline-offset:0;border-color:var(--blue)}

.chips.compact .chip{padding:5px 9px;font-size:10.5px;border-radius:14px}

.opt{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:11px;

.minw-btn{display:inline-flex;align-items:center;gap:5px;background:#EEF3FE;color:#1D4ED8;

/* 모달 팝업 */

.togrow{display:flex;align-items:center;gap:10px;padding:6px 0}
.togrow .tt{flex:1;font-size:12px;color:#334155}

.quickbtn{width:100%;border:1px dashed #CBD5E1;background:#F8FAFC;border-radius:10px;padding:10px;

.notice{border-radius:11px;padding:10px 12px;margin-bottom:11px}

.res .rrow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.09)}
.res .rrow:last-of-type{border-bottom:0}
.res .rlab{font-size:11.5px;color:#A8BEDC;display:flex;align-items:center}
.res .rval{font-size:12.5px;font-weight:700;color:#F1F6FC;font-variant-numeric:tabular-nums}
.res .rval.zero{color:#6D86AC;font-weight:600;font-size:11px}
.res .total{margin-top:10px;padding-top:10px;border-top:1px solid rgba(232,200,138,.35);display:flex;justify-content:space-between;align-items:baseline}
.res .total .rlab{font-size:12px;color:var(--foil);font-weight:600}
.res .total .rval{font-size:18px;color:#fff;font-weight:800}
.res .subhead{font-size:10.5px;font-weight:800;color:var(--foil);margin:10px 0 2px;letter-spacing:.02em}
.res .rded{margin-top:2px}
.res .rnet{margin-top:6px;padding-top:8px;padding-bottom:8px;border-top:1px dashed rgba(232,200,138,.35);
  display:flex;justify-content:space-between;align-items:baseline}
.res .rnet .rlab{font-size:12px;color:var(--foil);font-weight:700}
.res .rnet .rval{font-size:16.5px;color:#fff;font-weight:800}

.gapcard{border-radius:12px;padding:12px 13px;margin-bottom:11px;background:#FEF2F2;border:1px solid #F6C9C9}
.gapcard.zero{background:#EAF7F5;border:1px solid #B4E0D9}
.gapcard.neg{background:#F0F5FF;border:1px solid #C9DBFA}
.gapcard .gh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.gapcard .gl{font-size:12px;font-weight:800;color:#991B1B}
.gapcard .gv{font-size:18px;font-weight:800;color:#991B1B}
.gapcard.zero .gl,.gapcard.zero .gv{color:#0B7267}
.gapcard.neg .gl,.gapcard.neg .gv{color:#1E3A8A}
.gapcard .aibtn{margin-top:9px;width:100%;border:0;border-radius:9px;padding:10px;font-size:11.5px;font-weight:800;
  cursor:pointer;font-family:inherit;background:rgba(255,255,255,.7);color:#991B1B}
.gapcard.neg .aibtn{color:#1E3A8A}

.sever{background:#EAF7F5;border:1px solid #B4E0D9;border-radius:12px;padding:12px 13px;margin-bottom:11px}
.sever .sh{display:flex;justify-content:space-between;align-items:baseline}
.sever .sl{font-size:11.5px;color:#0B7267;font-weight:700;display:flex;align-items:center}
.sever .sv{font-size:17px;color:#0B7267;font-weight:800}
.sever p.snote{font-size:10.5px;color:#0F766E;margin-top:6px;line-height:1.55}

.disbtn{width:100%;border:1px dashed #CBD5E1;background:#F8FAFC;border-radius:10px;padding:11px;
  font-size:11px;font-weight:700;color:#94A3B8;cursor:not-allowed;font-family:inherit;margin-bottom:8px;text-align:center}

.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%) translateY(10px);z-index:250;
  background:rgba(15,23,42,.94);color:#fff;font-size:11px;padding:9px 14px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .24s,transform .24s;max-width:82%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body>

<div class="doc-head">
  <h1>Local Bridge · 정밀 임금·체불 계산기 v6</h1>
  <p>v5의 화면 구성(1~5단계 + 결과)은 그대로 두고, 퇴직금 검증·세금공제 표시·AI 맞춤 진단·임금명세서 자동인식(베타)을 보완했습니다.</p>
  <p class="hint">📄 임금명세서 불러오기는 사진을 실제로 인식(OCR)해 시급/월급 등을 채워봅니다 · 📁 근무기록장 불러오기는 이 단독 파일에 그 모듈이 없어 예시 데이터로 채우는 데모입니다</p>
</div>

<div class="phone">
  <div class="screen">
    <div class="status"><span>9:41</span><span>🔋 100%</span></div>
    <div class="stage">
      <div class="view">
        <div class="wz-top">
          <div class="r1"><h3>정밀 임금계산기</h3><span class="stepno" id="wzStepNo"></span></div>
          <div class="wz-bar" id="wzBar"></div>
        </div>
        <div class="wz-body" id="wzBody"></div>
        <div class="wz-foot">
          <button class="btn gho" id="wzPrev">이전</button>
          <button class="btn pri" id="wzNext">다음</button>
        </div>
      </div>
    </div>
    <div class="modal-bg" id="modalBg">
      <div class="modal-card">
        <h5 id="mTitle">도움말 <span id="mCloseX" style="cursor:pointer;color:#94A3B8">✕</span></h5>
        <div class="m-body" id="mBody"></div>
        <button class="m-close" id="mCloseBtn">확인</button>
      </div>
    </div>
    <input type="file" id="payslipFile" accept="image/*" style="display:none">
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const won = n => Math.round(n||0).toLocaleString("en-US");
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("show"),2600); }

function openModal(title, htmlContent){
  $("#mTitle").innerHTML = title + ' <span id="mCloseX" style="cursor:pointer;color:#94A3B8">✕</span>';
  $("#mBody").innerHTML = htmlContent;
  $("#modalBg").classList.add("show");
  $("#mCloseX").onclick = closeModal;
}
function closeModal(){ $("#modalBg").classList.remove("show"); }
$("#mCloseBtn").onclick = closeModal;

const YEAR = 2026;
const MINWAGE_TABLE = {
  2025:{ hour:10030, month:2096270 },
  2026:{ hour:10320, month:2156880 }
};
const MW = () => MINWAGE_TABLE[YEAR];
/* v4 수정사항 문서 기준 2026년 근로자 부담률: 국민연금9%(근로자4.5%) · 건강보험6.99%(근로자3.495%) ·
   장기요양보험(건강보험료의 12.27%) · 고용보험0.9% → 합계 약 9.32% */
const INS_DETAIL = { pension:0.045, health:0.03495, ltcOfHealth:0.1227, employment:0.009 };
const insuranceRate = () => INS_DETAIL.pension + INS_DETAIL.health + (INS_DETAIL.health*INS_DETAIL.ltcOfHealth) + INS_DETAIL.employment;
const BIZ_TAX = 0.033; // 사업소득세 3% + 지방소득세 0.3%
const WEEKS_M = 4.345;
const DAYS_M  = 30.4167;

/* 상태 관리 */
const CV = {
  periodMode:"month", multiMonths:3, rangeStart:"", rangeEnd:"",
  visa:"E-9", visaCustom:"",
  payType:"hour", pay:MW().hour,
  dailyHours:8, dayCountTotal:22, weekHours:40,
  otH:0, nightH:0, holH:0,
  hireDate:"", leaveDate:"", absent:false,
  bonus1y:0, vacation1y:0, // 퇴직금 산정용 정기상여금 및 연차수당(최근 1년)
  size:"over5",
  tax:"four", roomOn:false, roomAmtTotal:0, roomType:"dorm",
  received:0
};

function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){
  const d1=new Date(a), d2=b?new Date(b):new Date(todayStr());
  if(isNaN(d1)||isNaN(d2)) return 0;
  return Math.max(0, Math.round((d2-d1)/86400000));
}
function periodsCount(){
  if(CV.periodMode==="multi") return Math.max(1, Number(CV.multiMonths)||1);
  if(CV.periodMode==="range"){
    if(!CV.rangeStart || !CV.rangeEnd) return 1;
    const [y1,m1]=CV.rangeStart.split("-").map(Number), [y2,m2]=CV.rangeEnd.split("-").map(Number);
    if(!y1||!y2) return 1;
    return Math.max(1, (y2-y1)*12+(m2-m1)+1);
  }
  return 1;
}
function periodLabel(){
  const n=periodsCount();
  if(CV.periodMode==="month") return "1개월 (이번 달)";
  if(CV.periodMode==="multi") return n+"개월";
  if(CV.periodMode==="range" && CV.rangeStart && CV.rangeEnd) return CV.rangeStart+"~"+CV.rangeEnd+" ("+n+"개월)";
  return n+"개월";
}

/* ==================================================================
   임금 계산 로직
   ================================================================== */
function calcWage(c){
  const over5 = c.size === "over5";
  const periods = periodsCount();

  const contractH = Math.max(0, Number(c.weekHours)||0);
  const legalH = Math.min(contractH, 40);
  const over15 = contractH >= 15;
  const weeklyRestH = (over15 && !c.absent) ? (legalH/40)*8 : 0;
  const monthStdH = contractH * WEEKS_M;
  const monthRestH = weeklyRestH * WEEKS_M;
  const totalStdH = monthStdH * periods;
  const totalRestH = monthRestH * periods;

  let hourly, baseTotal, weeklyPayTotal, weeklyIncluded=false;
  if(c.payType === "hour"){
    hourly = Math.max(0, Number(c.pay)||0);
    baseTotal = hourly * totalStdH;
    weeklyPayTotal = hourly * totalRestH;
  }else if(c.payType === "day"){
    const dailyH = Number(c.dailyHours)>0 ? Number(c.dailyHours) : 8;
    hourly = dailyH>0 ? (Number(c.pay)||0)/dailyH : 0;
    baseTotal = (Number(c.pay)||0) * Math.max(0, Number(c.dayCountTotal)||0);
    weeklyPayTotal = hourly * totalRestH;
  }else if(c.payType === "week"){
    hourly = contractH>0 ? (Number(c.pay)||0)/contractH : 0;
    baseTotal = hourly * totalStdH;
    weeklyPayTotal = hourly * totalRestH;
  }else if(c.payType === "year"){
    const monthlyPay = (Number(c.pay)||0)/12;
    const denom = monthStdH+monthRestH;
    hourly = denom>0 ? monthlyPay/denom : 0;
    baseTotal = monthlyPay * periods;
    weeklyPayTotal = 0; weeklyIncluded = true;
  }else{ // month
    const denom = monthStdH+monthRestH;
    hourly = denom>0 ? (Number(c.pay)||0)/denom : 0;
    baseTotal = Math.max(0, Number(c.pay)||0) * periods;
    weeklyPayTotal = 0; weeklyIncluded = true;
  }

  const otMul = over5 ? 1.5 : 1.0;
  const ntMul = over5 ? 0.5 : 0.0;
  const holMul = over5 ? 1.5 : 1.0;
  const otH = Math.max(0, Number(c.otH)||0);
  const ntH = Math.max(0, Number(c.nightH)||0);
  const holH = Math.max(0, Number(c.holH)||0);
  const otPay = otH*hourly*otMul, ntPay = ntH*hourly*ntMul, holPay = holH*hourly*holMul;

  const gross = baseTotal + weeklyPayTotal + otPay + ntPay + holPay;
  const roomAmtTotal = c.roomOn ? Math.max(0, Number(c.roomAmtTotal)||0) : 0;

  let taxRate=null, taxAmt=null, net=null, netFour=null, netBiz=null, taxAmtFour=null, taxAmtBiz=null;
  if(c.tax==="unknown"){
    taxAmtFour = gross*insuranceRate();
    taxAmtBiz  = gross*BIZ_TAX;
    netFour = gross - taxAmtFour - roomAmtTotal;
    netBiz  = gross - taxAmtBiz - roomAmtTotal;
  }else{
    taxRate = c.tax==="four" ? insuranceRate() : c.tax==="biz" ? BIZ_TAX : 0;
    taxAmt = gross*taxRate;
    net = gross - taxAmt - roomAmtTotal;
  }

  /* 최저임금 · 숙식비 공제 후 환산시급 검증 */
  const totalH = totalStdH + totalRestH + otH + holH;
  const afterRoomHourly = totalH>0 ? (gross - roomAmtTotal)/totalH : 0;
  const roomBelowMin = roomAmtTotal>0 && afterRoomHourly>0 && afterRoomHourly < MW().hour;
  const payBelowMin = hourly>0 && hourly < MW().hour;

  /* 퇴직금 정밀 산정 (3개월 평균임금 근사 + 상여금/연차 3/12 가산, 통상임금과 비교) */
  const days = daysBetween(c.hireDate, c.leaveDate);
  const eligible = !!c.hireDate && days>=365 && over15;

  const monthlyGrossAvg = periods>0 ? gross/periods : gross;
  const bonus3m = (Number(c.bonus1y)||0) * (3/12);
  const vacation3m = (Number(c.vacation1y)||0) * (3/12);
  const avgDaily = (monthlyGrossAvg * 3 + bonus3m + vacation3m) / (DAYS_M * 3);

  const dailyStdH = Math.min(contractH>0 ? contractH/5 : 8, 8);
  const ordDaily = hourly*dailyStdH;
  const baseDaily = Math.max(avgDaily, ordDaily);
  const usedOrdinary = ordDaily>avgDaily;
  const severance = eligible ? baseDaily*30*(days/365) : 0;

  const received = Math.max(0, Number(c.received)||0);
  let gap=null, gapFour=null, gapBiz=null;
  if(c.tax==="unknown"){
    gapFour = netFour-received;
    gapBiz = netBiz-received;
  }else{
    gap = net-received;
  }

  return { over5, periods, hourly, baseTotal, weeklyPayTotal, weeklyIncluded, over15, otH, ntH, holH,
           otPay, ntPay, holPay, gross, taxRate, taxAmt, taxAmtFour, taxAmtBiz, roomAmtTotal,
           net, netFour, netBiz, payBelowMin, roomBelowMin, afterRoomHourly,
           days, eligible, severance, baseDaily, avgDaily, ordDaily, usedOrdinary,
           received, gap, gapFour, gapBiz };
}

       '<p class="snote">임금과 별개로, 퇴직할 때 한 번 받는 돈입니다.</p></div>';
    h += '<details class="more-box"><summary>💬 퇴직금, 왜 그리고 얼마나 받아야 하는지 보기</summary>'+
       '<div class="more-content">'+severanceNarrative(r)+'</div></details>';
  }else if(CV.hireDate){
    h += '<details class="more-box"><summary>예상 퇴직금 (현재는 요건 미충족)</summary>'+
       '<div class="more-content">'+severanceNarrative(r)+'</div></details>';
  }

  /* 법률 수식 & 안내 */
  h += '<details class="more-box"><summary>📐 법률 수식 상세보기</summary>'+
     '<div class="more-content">'+
       '<p>• 통상시급: (월급/연봉) ÷ 월 유급시간(주 40시간 기준 209시간 등)</p>'+
       '<p>• 주휴수당: (주 소정근로시간 ÷ 40) × 8h × 통상시급 × 4.345주</p>'+
       '<p>• 가산수당: 5인 이상 사업장 연장 1.5배 · 야간 0.5배(가산분) · 휴일 1.5배(8h 초과분 2.0배)</p>'+
       '<p>• 세금: 4대보험 근로자부담 약 '+(insuranceRate()*100).toFixed(2)+'% 또는 사업소득세 3.3%</p>'+
       '<p>• 퇴직금: 1일 평균임금 × 30일 × (재직일수 ÷ 365), 평균임금이 통상임금보다 낮으면 통상임금 적용</p>'+
     '</div></details>';

  h += '<details class="more-box"><summary>⚠ 이 금액은 참고용 예상액입니다 (법적 고지)</summary>'+
     '<div class="more-content">본 계산기는 근로기준법 표준 공식을 적용한 추정치입니다. 사업장의 특수 근로조건에 따라 차이가 발생할 수 있으며, 법적 확정 효력을 갖지 않습니다. 정확한 체불액은 근로감독관 조사에서 산정됩니다.</div></details>';

  h += '<button class="disbtn" id="saveWl" disabled>📅 근무기록장에 저장 (연동 예정)</button>';
  h += '<button class="disbtn" id="goNavi" disabled>💸 임금체불 내비게이터 연결 (연동 예정)</button>';

  return h;
}

/* ==================================================================
   AI 스타일 맞춤 설명 생성기 (규칙 기반 · 실제 계산값을 근거로 문장 구성)
   ================================================================== */
function severanceNarrative(r){
  if(!CV.hireDate) return "입사일을 입력하시면 재직 기간을 계산해 퇴직금 여부를 알려드립니다.";
  const yrs = Math.floor(r.days/365);
  const remDays = r.days - yrs*365;
  const months = Math.floor(remDays/DAYS_M);
  let tenureTxt = "";
  if(yrs>0) tenureTxt += yrs+"년 ";
  if(months>0) tenureTxt += months+"개월";
  if(!tenureTxt) tenureTxt = r.days+"일";

  if(!r.eligible){
    const reasons=[];
    if(r.days<365) reasons.push("아직 계속근로기간이 1년(365일)을 채우지 못했어요(현재 "+r.days+"일, 약 "+tenureTxt+")");
    if(!r.over15) reasons.push("주당 약정 근로시간이 15시간 미만이에요");
    return "「근로자퇴직급여 보장법」은 ① 계속근로기간 1년 이상, ② 4주 평균 주 15시간 이상, 두 조건을 모두 충족해야 퇴직금이 발생한다고 정하고 있어요. 지금 입력하신 내용으로는 "+reasons.join(", ")+"라서 아직 퇴직금 요건을 채우지 못한 상태예요. 조건을 채우게 되면 이 계산기에서 바로 예상 금액을 보여드릴게요.";
  }

  return "입사일부터 "+(CV.leaveDate?"퇴사일까지":"오늘까지")+" 총 "+r.days+"일, 약 "+tenureTxt+" 동안 계속 근무하셨어요. 이는 「근로자퇴직급여 보장법」이 정한 두 가지 요건 — ① 계속근로기간 1년 이상, ② 4주 평균 주 15시간 이상 — 을 모두 충족합니다. 그래서 근로 형태(정규직·계약직·아르바이트 상관없이)와 사업장 규모(5인 미만 포함)에 관계없이 퇴직금을 받을 권리가 있어요."+
    (r.usedOrdinary ? " 최근 임금이 적었던 기간이 있어 평균임금 대신 통상임금 기준으로 계산했어요." : "")+
    " 계산식은 1일 평균임금 "+won(r.baseDaily)+"원 × 30일 × (재직일수 "+r.days+"일 ÷ 365) 이며, 그 결과 약 <b>"+won(r.severance)+"원</b>을 받으셔야 해요. 퇴직금은 퇴직일로부터 14일 이내에 지급되어야 하고, 청구권은 퇴직 후 3년이 지나면 시효로 소멸된다는 점도 기억해 두세요.";
}

function explainGap(r){
  const gapVal = CV.tax==="unknown" ? Math.min(r.gapFour, r.gapBiz) : r.gap;
  const parts = [];
  if(gapVal > 0){
    if(r.payBelowMin) parts.push("계약된 통상시급이 <b>"+won(r.hourly)+"원</b>으로 "+YEAR+"년 최저임금 <b>"+won(MW().hour)+"원</b>보다 낮아요. 이 부분은 계약을 그렇게 맺었더라도 무효이고, 최저임금과의 차액은 반드시 청구할 수 있어요.");
    if(!r.weeklyIncluded && r.weeklyPayTotal>0) parts.push("주휴수당 <b>"+won(r.weeklyPayTotal)+"원</b>이 계산에 포함되어 있어요. 실제로 받으신 돈에 이 항목이 빠져 있다면, 당신은 이 금액만큼 더 받아야 해요.");
    if(r.otPay>0) parts.push("연장근로 "+r.otH+"시간에 대한 가산수당 <b>"+won(r.otPay)+"원</b>이 포함되어 있어요. "+(r.over5?"5인 이상 사업장은 통상시급의 1.5배를 지급해야 해요.":"5인 미만이라도 일한 시간만큼 통상임금(1.0배)은 지급되어야 해요."));
    if(r.ntPay>0) parts.push("야간근로(22시~06시) "+r.ntH+"시간에 대한 가산수당 <b>"+won(r.ntPay)+"원</b>이 포함되어 있어요.");
    if(r.holPay>0) parts.push("휴일근로 "+r.holH+"시간에 대한 수당 <b>"+won(r.holPay)+"원</b>이 포함되어 있어요.");
    if(CV.roomOn && r.roomAmtTotal>0) parts.push("숙식비 <b>"+won(r.roomAmtTotal)+"원</b>이 공제 대상으로 계산되어 있어요. 서면 동의 없이 공제됐거나 지나치게 큰 금액이라면 그 자체가 문제일 수 있어요."+(r.roomBelowMin?" 특히 지금은 숙식비를 빼고 나면 최저임금 아래로 내려가는 상태예요.":""));
    if(CV.tax==="biz") parts.push("지금 사업소득 3.3%로 공제되고 있다면, 실제 근무 형태(출퇴근 시간이 정해져 있고 지시를 받는 등)에 따라 근로자로 인정될 수 있어요. 그렇다면 세금 처리 방식과 별개로 주휴수당·퇴직금 같은 다른 권리도 함께 놓치고 있을 가능성이 있어요.");
    if(CV.size==="unknown") parts.push("사업장 규모를 정확히 몰라 지금은 5인 미만(가산수당 없음) 기준으로 보수적으로 계산했어요. 실제로 5인 이상이라면, 당신은 지금 계산된 것보다 더 큰 금액을 받으셔야 해요.");
    const head = "<p><span class='ai-tag'>🤖 AI 진단</span><br>지금까지 입력하신 내용을 바탕으로 보면, 당신은 최소 약 <b>"+won(Math.abs(gapVal))+"원</b>을 더 받으셔야 할 가능성이 높아요. 아래 항목들을 확인해 보세요.</p>";
    const body = parts.length ? parts.map(p=>"<p>· "+p+"</p>").join("") : "<p>구체적인 원인은 특정하기 어렵지만, 임금명세서 항목을 하나씩 대조해 보시길 권해요.</p>";
    const foot = "<p>이 진단은 입력값을 근거로 한 참고용 추정이에요. 확정된 체불액은 근로감독관 조사에서 정해지니, 먼저 임금명세서를 요청해 항목별로 비교해 보고 그래도 설명이 안 되면 고용노동부에 상담해 보세요.</p>";
    return head+body+foot;
  }else{
    parts.push("포괄임금제 계약이라면 연장·야간수당이 월급에 미리 합산되어 있을 수 있어요.");
    parts.push("상여금, 식대, 교통비처럼 이 계산기가 반영하지 않는 항목이 함께 지급되었을 수 있어요.");
    if(CV.tax==="none") parts.push("세금이 공제되지 않는다고 선택하셨는데, 실제로는 일부 공제되고 있다면 반대로 계산이 달라질 수 있어요.");
    const head = "<p><span class='ai-tag'>🤖 AI 진단</span><br>계산 결과보다 약 <b>"+won(Math.abs(gapVal))+"원</b> 더 받으셨어요. 체불은 아니고, 대부분 계산 방식의 차이예요.</p>";
    const body = parts.map(p=>"<p>· "+p+"</p>").join("");
    const foot = "<p>임금명세서의 항목 구성을 확인해 보시면 어떤 항목이 더 포함되어 있는지 알 수 있어요.</p>";
    return head+body+foot;
  }
}

   이벤트 바인딩 및 렌더링

function renderCalc(){
  $("#wzStepNo").textContent = wzStep<TOTAL_STEPS ? "STEP "+(wzStep+1)+" / "+TOTAL_STEPS : "RESULT";
  const bar=$("#wzBar"); bar.innerHTML="";
  for(let i=0;i<TOTAL_STEPS;i++){ const e=document.createElement("i");
    if(i<wzStep) e.className="done"; else if(i===wzStep) e.className="on"; bar.appendChild(e); }

  const b=$("#wzBody");
  b.innerHTML = [step1,step2,step3,step4,step5,resultHTML][wzStep]();
  b.scrollTop = 0;

  $("#wzPrev").style.display = wzStep===0 ? "none" : "block";
  $("#wzNext").textContent = wzStep===TOTAL_STEPS-1 ? "계산하기" : wzStep===TOTAL_STEPS ? "처음부터 다시" : "다음";
  bindCalc();
}

function bindCalc(){
  const b=$("#wzBody");

  // 도움말 모달
  b.querySelectorAll("[data-q]").forEach(el=>{
    el.addEventListener("click",(e)=>{
      e.stopPropagation();
      const key = el.dataset.q;
      if(HELP_DICT[key]) openModal(HELP_DICT[key][0], HELP_DICT[key][1]);
    });
  });

  // AI 진단 버튼
  $("#gapAiBtn")?.addEventListener("click", ()=>{
    const r = calcWage(CV);
    openModal("🤖 AI 맞춤 진단", explainGap(r));
  });

  // 버튼 세그먼트 & 칩스
  b.querySelectorAll("[data-pm]").forEach(el=>el.addEventListener("click",()=>{ CV.periodMode=el.dataset.pm; renderCalc(); }));
  b.querySelectorAll("[data-pt]").forEach(el=>el.addEventListener("click",()=>{
    CV.payType=el.dataset.pt;
    CV.pay = CV.payType==="hour"?MW().hour : CV.payType==="day"?90000 : CV.payType==="week"?400000 : CV.payType==="year"?26000000 : 2200000;
    renderCalc();
  }));
  b.querySelectorAll("[data-ck]").forEach(el=>el.addEventListener("click",()=>{ CV[el.dataset.ck]=el.dataset.cv; renderCalc(); }));
  b.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("click",()=>{ CV[el.dataset.k]=el.dataset.v; renderCalc(); }));

  // Inputs
  b.querySelectorAll("input").forEach(el=>el.addEventListener("input",()=>{
    if(el.readOnly) return;
    const map={f_pay:"pay",f_dailyHours:"dailyHours",f_dayCountTotal:"dayCountTotal",f_week:"weekHours",
      f_ot:"otH",f_night:"nightH",f_hol:"holH",f_room:"roomAmtTotal",f_recv:"received",
      f_multiM:"multiMonths",f_bonus1y:"bonus1y",f_vacation1y:"vacation1y"};
    if(map[el.id]) CV[map[el.id]]=Number(el.value)||0;
    if(el.id==="f_visaCustom") CV.visaCustom=el.value;
    if(el.id==="f_hire") CV.hireDate=el.value;
    if(el.id==="f_leave") CV.leaveDate=el.value;
    if(el.id==="f_rangeStart") CV.rangeStart=el.value;
    if(el.id==="f_rangeEnd") CV.rangeEnd=el.value;
  }));

  $("#absTog")?.addEventListener("click",()=>{ CV.absent=!CV.absent; renderCalc(); });
  $("#roomTog")?.addEventListener("click",()=>{ CV.roomOn=!CV.roomOn; renderCalc(); });
  $("#minwBtn")?.addEventListener("click",()=>{ CV.payType="hour"; CV.pay=MW().hour; renderCalc(); });
  $("#zeroBtn")?.addEventListener("click",()=>{ CV.received=0; renderCalc(); });

  $("#btnImportWork")?.addEventListener("click", importFromWorklog);
  $("#btnImportPay")?.addEventListener("click", ()=> $("#payslipFile").click());
}

/* ==================================================================
   📁 근무기록장 불러오기 — 이 단독 파일에는 근무기록장 모듈이 없어
   실제 연동 대신, 실제로 필드를 채워 넣는 예시(데모) 데이터를 사용합니다.
   ================================================================== */
function importFromWorklog(){
  Object.assign(CV, {
    payType:"hour", pay:MW().hour, weekHours:40,
    otH:12, nightH:6, holH:0,
    hireDate: CV.hireDate || "2024-03-02"
  });
  toast("근무기록장 모듈은 이 단독 파일엔 없어서, 실제 연동 대신 예시 데이터로 채워드렸어요.");
  renderCalc();
}

/* ==================================================================
   📄 임금명세서 불러오기 — 실제 이미지 업로드 + OCR(Tesseract.js) 시도.
   베타 기능이며, 인식 실패 시 안내 후 수동 입력으로 유도합니다.
   ================================================================== */
function loadTesseract(){
  return new Promise((resolve,reject)=>{
    if(window.Tesseract){ resolve(); return; }
    const s=document.createElement("script");
    s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js";
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error("tesseract-load-fail"));
    document.head.appendChild(s);
  });
}
async function handlePayslipFile(file){
  const btn=$("#btnImportPay");
  if(btn){ btn.disabled=true; btn.textContent="🔎 인식 중..."; }
  toast("임금명세서를 읽고 있어요. 잠시만 기다려 주세요...");
  try{
    await loadTesseract();
    const {data} = await Tesseract.recognize(file, "kor+eng");
    applyOcrText(data.text||"");
  }catch(e){
    toast("자동 인식에 실패했어요(네트워크 또는 이미지 품질 문제일 수 있어요). 값을 직접 입력해 주세요.");
  }finally{
    if(btn){ btn.disabled=false; btn.textContent="📄 임금명세서 불러오기"; }
  }
}
function applyOcrText(text){
  const lines = text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const numFrom = s => { const m = s.match(/([0-9][0-9,]{2,})\s*원?/); return m ? Number(m[1].replace(/,/g,"")) : null; };
  const kw = [["월급","month"],["기본급","month"],["시급","hour"],["일급","day"],["주급","week"],["연봉","year"]];
  let found=false;
  for(const line of lines){
    for(const [k,pt] of kw){
      if(line.includes(k)){
        const n = numFrom(line);
        if(n && n>=1000){ CV.payType=pt; CV.pay=n; found=true; break; }
      }
    }
    if(found) break;
  }
  if(found){
    const label = ({hour:"시급",day:"일급",week:"주급",month:"월급",year:"연봉"})[CV.payType];
    toast("임금명세서에서 "+label+" "+won(CV.pay)+"원을 인식해 채웠어요. 실제 값과 다르면 직접 고쳐주세요.");
    renderCalc();
  }else{
    toast("금액을 정확히 인식하지 못했어요. 값을 직접 입력해 주세요.");
  }
}
$("#payslipFile").addEventListener("change",(e)=>{
  const f=e.target.files && e.target.files[0];
  if(f) handlePayslipFile(f);
  e.target.value="";
});

$("#wzPrev").addEventListener("click",()=>{ if(wzStep>0){ wzStep--; renderCalc(); } });
$("#wzNext").addEventListener("click",()=>{
  if(wzStep<TOTAL_STEPS){ wzStep++; renderCalc(); if(wzStep===TOTAL_STEPS) toast("계산이 완료되었습니다."); }
  else { wzStep=0; renderCalc(); }
});

renderCalc();
</script>
