<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Bridge — 외국인 노동자 정밀 임금·체불 진단 계산기</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { colors: {
    trustBlue: '#1E40AF', safetyTeal: '#0D9488', alertAmber: '#D97706', cleanSlate: '#F8FAFC'
  } } } };
</script>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Pretendard',sans-serif;background:#F8FAFC;color:#1E293B;}
  .ct-btn,.tp-btn,.sc-btn{transition:.15s;}
  .edu{border-left:3px solid #1E40AF;background:#EFF6FF;border-radius:0 10px 10px 0;padding:10px 12px;font-size:12px;color:#1E3A8A;line-height:1.6;}
  .qmark{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#E2E8F0;color:#475569;font-size:11px;font-weight:700;cursor:pointer;margin-left:6px;}
  #modalOverlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  #modalOverlay.show{display:flex;}
  #modalBox{background:#fff;border-radius:16px;max-width:640px;width:100%;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
  #modalBody{overflow-y:auto;padding:16px 20px;}
  table.infoTbl{width:100%;border-collapse:collapse;font-size:11px;}
  table.infoTbl th,table.infoTbl td{border:1px solid #E2E8F0;padding:6px 8px;text-align:center;}
  table.infoTbl th{background:#F1F5F9;font-weight:700;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute;left:0;top:0;width:100%;padding:20px;}
  }
</style>
</head>
<body class="min-h-screen py-6 px-4 sm:px-6 lg:px-8">
<div class="max-w-4xl mx-auto space-y-5">

  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-3 flex flex-wrap items-center justify-center gap-2" id="langBar"></div>

  <header class="text-center bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
    <span id="hdrBadge" class="inline-block bg-trustBlue/10 text-trustBlue text-xs font-bold px-3 py-1 rounded-full mb-2"></span>
    <h1 id="hdrTitle" class="text-2xl sm:text-3xl font-extrabold text-gray-900"></h1>
    <p id="hdrSub" class="text-xs sm:text-sm text-gray-600 mt-2"></p>
    <div id="intro-chips" class="flex flex-wrap justify-center gap-2 mt-4 text-[11px]"></div>
    <button type="button" id="worklogBtn" onclick="fillFromWorklog()" class="mt-4 inline-flex items-center gap-1.5 bg-safetyTeal/10 text-safetyTeal text-xs font-bold px-3.5 py-2 rounded-lg border border-safetyTeal/30"></button>
  </header>

  <main class="bg-white shadow-xl rounded-2xl p-6 sm:p-8 border border-gray-100 space-y-8">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="p-5 bg-trustBlue/5 rounded-2xl border-2 border-trustBlue/20 space-y-3">
        <label id="lbl-contract" class="block text-sm font-bold text-trustBlue"></label>
        <div class="grid grid-cols-3 gap-2" id="ctRow1"></div>
        <div class="grid grid-cols-2 gap-2" id="ctRow2"></div>
      </div>
      <div class="p-5 bg-safetyTeal/5 rounded-2xl border-2 border-safetyTeal/20 space-y-3">
        <label id="lbl-period" class="block text-sm font-bold text-safetyTeal"></label>
        <div class="grid grid-cols-1 gap-2" id="tpRow"></div>
        <div id="scopeBox" class="hidden pt-2 border-t border-safetyTeal/20 space-y-2">
          <p id="scopeQ" class="text-xs font-semibold text-gray-700"></p>
          <div class="grid grid-cols-2 gap-2" id="scRow"></div>
        </div>
      </div>
    </div>

    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label id="lbl-bizsize" class="block text-xs font-semibold text-gray-600 mb-1"></label>
        <select id="business_size" class="w-full p-2.5 bg-white border rounded-lg text-sm" onchange="calcAndRender()"></select>
      </div>
      <div>
        <label id="lbl-visa" class="block text-xs font-semibold text-gray-600 mb-1"></label>
        <select id="visa_track" class="w-full p-2.5 bg-white border rounded-lg text-sm"></select>
      </div>
    </div>

    <div id="dynamic-inputs" class="p-5 bg-blue-50/30 rounded-xl border border-blue-100 space-y-4"></div>

    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-3">
      <label class="flex items-center text-sm font-bold text-gray-800" id="lbl-tax-wrap">
        <span id="lbl-tax"></span><span class="qmark" onclick="openTaxModal()">?</span>
      </label>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="taxOptions"></div>
      <div id="freelance-warning" class="hidden p-3 bg-amber-50 border border-amber-300 rounded-lg text-xs text-amber-900 flex items-start gap-2">
        <span class="text-base">⚠️</span><div id="freelanceWarnBody"></div>
      </div>
    </div>

    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-3">
      <label class="flex items-center text-sm font-bold text-gray-800">
        <span id="lbl-room"></span><span class="qmark" onclick="openRoomModal()">?</span>
      </label>
      <div class="flex items-center gap-3">
        <input type="checkbox" id="room_on" class="w-4 h-4" onchange="onRoomToggle()">
        <label for="room_on" id="lbl-room-check" class="text-xs text-gray-600"></label>
      </div>
      <div id="room-fields" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label id="lbl-room-amt" class="block text-xs font-semibold text-gray-600 mb-1"></label>
          <input type="number" id="room_amt" value="200000" class="w-full p-2.5 bg-white border rounded-lg text-sm" oninput="calcAndRender()">
        </div>
        <div>
          <label id="lbl-room-type" class="block text-xs font-semibold text-gray-600 mb-1"></label>
          <select id="room_type" class="w-full p-2.5 bg-white border rounded-lg text-sm"></select>
        </div>
      </div>
    </div>

    <button type="button" id="calcBtnEl" onclick="calcAndRender(true)" class="w-full bg-trustBlue hover:bg-blue-800 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-all text-base"></button>

    <div id="resultCard" class="hidden border-t-2 border-trustBlue pt-6 space-y-5"></div>

  </main>
</div>

<div id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div id="modalBox">
    <div class="flex items-center justify-between px-5 py-3.5 border-b">
      <h3 id="modalTitle" class="text-sm font-bold text-gray-900"></h3>
      <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 text-lg leading-none">✕</button>
    </div>
    <div id="modalBody"></div>
    <div class="px-5 py-3.5 border-t">
      <button onclick="closeModal()" class="w-full bg-trustBlue text-white font-bold py-2.5 rounded-lg text-sm">확인</button>
    </div>
  </div>
</div>

  freelanceWarnBody: TR('[위장 프리랜서 확인이 필요할 수 있어요] 매일 정해진 시간에 출퇴근하고 사장님의 지시를 받으며 일하는데 3.3%만 떼고 있다면, 계약상 이름과 관계없이 근로기준법상 근로자로 인정될 수 있습니다. 근로자로 인정되면 주휴수당·퇴직금·4대보험을 요구할 수 있습니다. 다만 이는 근로감독관 조사나 법원 판단으로 확정되는 사안입니다.',
    '[You may need to check for a disguised freelance arrangement] If you clock in at fixed times and follow your employer\'s instructions but only 3.3% is deducted, you may legally be an employee regardless of your contract\'s label. Employees can claim weekly holiday pay, severance and social insurance. This is confirmed only by a labor inspector or court.',

  taxModalIntro: TR('1) 4대보험 약 9.72% 공제 — 근로자를 회사와 고용관계에 있다고 보고 4대보험에 가입하여 세금을 적용하는 방법입니다.','1) About 9.72% social insurance — applied when you are formally employed and enrolled in the four social insurances.','1) Khoảng 9,72% bảo hiểm xã hội — áp dụng khi bạn là nhân viên chính thức, tham gia đủ 4 loại bảo hiểm.'),
  taxModalNote: TR('월 60시간 미만으로 일하는 초단시간 근로자는 국민연금·건강보험 가입대상이 아닌 경우가 일반적이라 이 공제가 없을 수 있어요. 2) 소득세 3.3% 공제 = 소득세 3% + 지방소득세(소득세의 10%). 정확한 가입 대상 여부는 국민연금공단·국민건강보험공단에 확인하는 것이 가장 정확합니다.',
    'Employees working under 60 hours a month are generally not required to enrol in the National Pension and Health Insurance, so this deduction may not apply. 2) 3.3% income tax = 3% income tax + local income tax (10% of the income tax). For your exact enrolment status, check with the National Pension Service / National Health Insurance Service.',
    'Người lao động làm dưới 60 giờ/tháng thường không bắt buộc tham gia Lương hưu quốc gia và Bảo hiểm y tế nên có thể không bị trừ khoản này. 2) Thuế thu nhập 3,3% = thuế thu nhập 3% + thuế thu nhập địa phương (10% của thuế thu nhập). Để biết chính xác, hãy hỏi Công ty Bảo hiểm hưu trí quốc gia / Bảo hiểm y tế quốc gia.'),

    'Deducting board/lodging costs from pay is only lawful with your clear written consent. If it was deducted without consent, or the amount seems excessive, this could count as unpaid wages — check your labor contract again! Also, your hourly rate after this deduction must not fall below the minimum wage.',

    '💡 Did you know about holiday work pay? Working on your weekly or agreed holiday pays 1.5× (2× beyond 8 hours). (Art. 56)',

  eduSeverance: TR('💡 퇴직금 받을 수 있는 거 아셨나요? 한 사업장에서 1년 이상, 주 평균 15시간 이상 일했다면 그만둘 때 퇴직금을 받을 권리가 있어요. (근로자퇴직급여 보장법 제8조)',

/* ==================================================================
   1. 마스터 데이터 — 매년/수시 갱신 대상 (학습 데이터 아님)
   ================================================================== */
const YEAR = 2026;
const MINWAGE_TABLE = { 2025:{hour:10030}, 2026:{hour:10320} };
const INS = { np:0.0475, hi:0.03595, ltciOfHi:0.1314, ei:0.009 }; // 2026년 근로자 부담 — 국민연금·건강보험·고용보험 요율 (출처: 국민연금공단·국민건강보험공단·고용보험 고시)
const INSURANCE_RATE = INS.np + INS.hi + INS.hi*INS.ltciOfHi + INS.ei; // ≈ 9.72%
const BIZ_TAX_RATE = 0.033;
const WEEKS_M = 4.345, DAYS_M = 30.4167;
const MW = () => MINWAGE_TABLE[YEAR].hour;

/* ==================================================================
   2. 계산 엔진 — 근로기준법 산식을 그대로 코드로 옮긴 규칙 기반 엔진
   ================================================================== */
function calcMonthly(c){
  let payType = c.payType, amount = c.amount;
  if(payType === 'weekly'){ amount = c.weekHours>0 ? c.amount/c.weekHours : 0; payType = 'hourly'; }

  const over5 = c.size === '5_over';
  const weekHours = Math.max(0, Number(c.weekHours)||0);
  const legalH = Math.min(weekHours,40);
  const over15 = weekHours >= 15;
  const weeklyRestH = (over15 && !c.absent) ? (legalH/40)*8 : 0;
  const periods = c.periods || WEEKS_M;
  const monthStdH = weekHours * periods;
  const monthRestH = weeklyRestH * periods;

  let hourly;
  if(payType==='hourly') hourly = amount;
  else if(payType==='daily'){ const dh = c.dailyHours>0 ? c.dailyHours : (weekHours>0?weekHours/5:8); hourly = dh>0 ? amount/dh : 0; }
  else { const denom = monthStdH+monthRestH; hourly = denom>0 ? amount/denom : 0; }

  let base, weeklyPay = hourly*monthRestH, weeklyIncluded=false;
  if(payType==='hourly') base = hourly*monthStdH;
  else if(payType==='daily') base = amount * Math.max(0, Number(c.dayCount)||0);
  else { base = amount * (periods/WEEKS_M); weeklyPay = 0; weeklyIncluded = true; }

  const otH = Math.max(0, Number(c.otH)||0), ntH = Math.max(0, Number(c.ntH)||0), holH = Math.max(0, Number(c.holH)||0);
  const otMul = over5?1.5:1.0, ntMul = over5?0.5:0.0;
  const otPay = otH*hourly*otMul, ntPay = ntH*hourly*ntMul;
  const holIn = Math.min(holH,8), holOut = Math.max(0,holH-8);
  const holPay = over5 ? (holIn*hourly*1.5 + holOut*hourly*2.0) : (holH*hourly*1.0);

  const gross = base + weeklyPay + otPay + ntPay + holPay;

  const roomAmt = c.roomOn ? Math.max(0, Number(c.roomAmt)||0) : 0;
  const totalH = monthStdH + monthRestH + otH + holH;
  const afterRoomHourly = totalH>0 ? (gross - roomAmt)/totalH : 0;
  const roomBelowMin = roomAmt>0 && afterRoomHourly>0 && afterRoomHourly < MW();
  const payBelowMin = hourly>0 && hourly < MW();

  function taxOf(method){ const rate = method==='ssi'?INSURANCE_RATE:method==='biz'?BIZ_TAX_RATE:0; return {rate, amt:gross*rate}; }
  let taxScenarios = c.tax==='unknown' ? {ssi:taxOf('ssi'), biz:taxOf('biz')} : {main:taxOf(c.tax)};
  function netOf(t){ return gross - t.amt - roomAmt; }

  const days = c.tenureDays || 0;
  const eligible = days>=365 && over15;
  const avgDaily = gross/DAYS_M;
  const dailyStdH = Math.min(weekHours>0?weekHours/5:8, 8);
  const ordDaily = hourly*dailyStdH;
  const baseDaily = Math.max(avgDaily, ordDaily);
  const severance = eligible ? baseDaily*30*(days/365) : 0;

  return { over5, hourly, base, weeklyPay, weeklyIncluded, weeklyRestH, over15,
           monthStdH, monthRestH, otPay, ntPay, holPay, otH, ntH, holH,
           gross, roomAmt, afterRoomHourly, roomBelowMin, payBelowMin,
           taxScenarios, netOf, eligible, severance, days };
}

function won(n){ return Math.round(n).toLocaleString()+(curLang==='ko'?'원':curLang==='en'?' KRW':' KRW'); }

function readInputs(){
  const tenureDays = num('inp_tenure_y')*365 + num('inp_tenure_m')*DAYS_M + num('inp_tenure_w')*7 + num('inp_tenure_d');
  const periods = (currentPeriod==='monthly' && currentScope==='week') ? 1 : WEEKS_M;
  return {
    payType: currentContract==='annual' ? 'monthly' : currentContract,
    amount: currentContract==='annual' ? num('inp_amt')/12 : num('inp_amt'),
    weekHours: currentContract==='daily' ? num('inp_dailyhours')*Math.max(1,num('inp_workdays')) : num('inp_week'),
    dailyHours: currentContract==='daily' ? num('inp_dailyhours') : 0,
    dayCount: num('inp_daycount'),
    otH: num('inp_ot'), ntH: num('inp_nt'), holH: num('inp_hol'),
    absent: document.getElementById('inp_absent') ? document.getElementById('inp_absent').checked : false,
    tenureDays, periods,
    size: document.getElementById('business_size').value,
    tax: document.querySelector('input[name="tax_type"]:checked').value,
    roomOn: document.getElementById('room_on').checked,
    roomAmt: num('room_amt'),
  };
}

function calcAndRender(showResult){
  if(!document.getElementById('inp_amt')) return;
  const c = readInputs();
  const r = calcMonthly(c);

  const card = document.getElementById('resultCard');
  if(!showResult && card.classList.contains('hidden')) return;
  card.classList.remove('hidden');

  const isWeek = currentPeriod==='monthly' && currentScope==='week';
  let html = '<div id="printArea">';
  const badgeOk = '<span class="bg-safetyTeal text-white text-xs font-bold px-3 py-1.5 rounded-full">'+t('badgeOk')+'</span>';
  const badgeBad = '<span class="bg-red-600 text-white text-xs font-bold px-3 py-1.5 rounded-full">'+t('badgeBad')+'</span>';

  html += '<div class="bg-gray-50 p-4 rounded-xl border">';
  html += '<h3 class="text-sm font-bold text-gray-800 mb-2">'+(isWeek?t('resultTitleWeek'):t('resultTitleMonth'))+'</h3>';
  html += rrow(t('rowBase'), won(r.base), currentContract==='hourly' ? (r.hourly+(curLang==='ko'?'원 × ':' × ')+r.monthStdH.toFixed(1)+'h') : '');
  if(r.weeklyIncluded) html += rrow(t('rowWeekly'), t('rowWeeklyIncluded'), '');
  else if(!r.over15) html += rrow(t('rowWeekly'), '0'+(curLang==='ko'?'원':''), t('rowWeeklyNo15'));
  else if(c.absent) html += rrow(t('rowWeekly'), '0'+(curLang==='ko'?'원':''), t('rowWeeklyAbsent'));
  else html += rrow(t('rowWeekly'), won(r.weeklyPay), '');
  if(r.otH>0) html += rrow(t('rowOT'), won(r.otPay), (r.over5?'1.5×':'1.0×')+' · '+r.otH+'h');
  if(r.ntH>0) html += rrow(t('rowNight'), won(r.ntPay), (r.over5?'+0.5×':'+0×')+' · '+r.ntH+'h');
  if(r.holH>0) html += rrow(t('rowHoliday'), won(r.holPay), (r.over5?'1.5~2.0×':'1.0×')+' · '+r.holH+'h');
  html += '<div class="flex justify-between items-center pt-2 mt-2 border-t font-bold text-gray-900"><span>'+t('rowGrossTotal')+'</span><span>'+won(r.gross)+'</span></div>';
  html += '</div>';

  const edu = [];
  if(!r.weeklyIncluded && r.weeklyPay>0) edu.push(t('eduWeekly'));
  if(r.otPay>0) edu.push(t('eduOT'));
  if(r.ntPay>0) edu.push(t('eduNight'));
  if(r.holPay>0) edu.push(t('eduHoliday'));
  if(r.eligible) edu.push(t('eduSeverance'));
  if(edu.length){ html += '<div class="space-y-2">'; edu.forEach(x=> html += '<div class="edu">'+x+'</div>'); html += '</div>'; }

  if(r.payBelowMin) html += warn('red', t('warnMinwageTitle')+' ('+won(r.hourly)+' &lt; '+won(MW())+')', t('warnMinwageBody'));
  if(r.roomBelowMin) html += warn('red', t('warnRoomMinTitle')+' ('+won(r.afterRoomHourly)+' &lt; '+won(MW())+')', t('warnRoomMinBody'));

  html += '<div class="bg-gray-50 p-4 rounded-xl border">';
  if(c.tax==='unknown'){
    html += '<h3 class="text-sm font-bold text-gray-800 mb-2">'+t('taxSecUnknown')+'</h3>';
    html += rrow(t('ssiScenario'), won(r.netOf(r.taxScenarios.ssi)), '');
    html += rrow(t('bizScenario'), won(r.netOf(r.taxScenarios.biz)), '');
  } else {
    const tx = r.taxScenarios.main, net = r.netOf(tx);
    html += '<h3 class="text-sm font-bold text-gray-800 mb-2">'+t('taxSecKnown')+'</h3>';
    html += rrow(t('rowTaxDeduct'), tx.amt>0?('− '+won(tx.amt)):('0'+(curLang==='ko'?'원':'')), (tx.rate*100).toFixed(2)+'%');
    if(r.roomAmt>0) html += rrow(t('rowRoomDeduct'), '− '+won(r.roomAmt), '');
    html += '<div class="flex justify-between items-center pt-2 mt-2 border-t font-bold text-trustBlue text-lg"><span>'+t('rowNetPay')+'</span><span>'+won(net)+'</span></div>';
  }
  html += '</div>';

  const mainNet = c.tax==='unknown' ? r.netOf(r.taxScenarios.ssi) : r.netOf(r.taxScenarios.main);
  let gapHtml = '', isPos = false;
  if(currentPeriod==='unpaid_long'){
    const months = num('inp_months')||1, believed = num('inp_believed'), receivedTotal = num('inp_received_total');
    const legalTotal = mainNet*months, gap = legalTotal - receivedTotal;
    isPos = gap>10000;
    gapHtml += '<div class="p-4 rounded-xl border '+(isPos?'bg-red-50 border-red-200':'bg-safetyTeal/5 border-safetyTeal/20')+'">';
    gapHtml += '<div class="flex items-center justify-between mb-2">'+(isPos?badgeBad:badgeOk)+'<span class="text-xs text-gray-500">'+months+' '+t('arrearsScopeNote')+'</span></div>';
    gapHtml += rrow(t('arrearsLegalTotal'), won(legalTotal), '');
    gapHtml += rrow(t('arrearsBelieved'), won(believed), '');
    gapHtml += rrow(t('arrearsActualTotal'), won(receivedTotal), '');
    gapHtml += '<div class="flex justify-between items-center pt-2 mt-2 border-t font-bold text-red-600"><span>'+t('arrearsDiffLabel')+'</span><span>'+(gap>=0?'+':'')+won(gap)+'</span></div>';
    if(isPos){ gapHtml += '<p class="text-xs text-amber-800 leading-relaxed mt-2">'+t('arrearsNote')+'</p>'+routingButtons(); }
    gapHtml += '</div>';
  } else {
    const received = num('inp_received'), gap = mainNet - received;
    const kind = Math.abs(gap)<10000 ? 'zero' : (gap>0?'pos':'neg');
    isPos = kind==='pos';
    gapHtml += '<div class="p-4 rounded-xl border '+(kind==='pos'?'bg-red-50 border-red-200':(kind==='neg'?'bg-blue-50 border-blue-200':'bg-safetyTeal/5 border-safetyTeal/20'))+'">';
    gapHtml += '<div class="flex items-center justify-between mb-2">'+(kind==='pos'?badgeBad:badgeOk)+'</div>';
    gapHtml += rrow(t('gapLegalMonth'), won(mainNet), '');
    gapHtml += rrow(t('gapActual'), won(received), '');
    gapHtml += '<div class="flex justify-between items-center pt-2 mt-2 border-t font-bold '+(kind==='pos'?'text-red-600':(kind==='neg'?'text-blue-600':'text-gray-700'))+'"><span>'+t('gapDiff')+'</span><span>'+(gap>=0?'+':'−')+won(Math.abs(gap))+'</span></div>';
    if(kind==='pos'){ gapHtml += '<p class="text-xs text-amber-800 leading-relaxed mt-2">'+t('gapPosNote')+'</p>'+routingButtons(); }
    else if(kind==='neg'){ gapHtml += '<p class="text-xs text-blue-800 leading-relaxed mt-2">'+t('gapNegNote')+'</p>'; }
    else { gapHtml += '<p class="text-xs text-gray-600 leading-relaxed mt-2">'+t('gapZeroNote')+'</p>'; }
    gapHtml += '</div>';
  }
  html += gapHtml;

  if(r.eligible){
    html += '<div class="bg-blue-50 p-4 rounded-xl border border-blue-200">';
    html += '<div class="flex justify-between items-center"><span class="text-sm font-bold text-trustBlue">'+t('severanceTitle')+' · '+r.days+t('severanceDays')+'</span><span class="font-bold text-trustBlue">'+won(r.severance)+'</span></div>';
    html += '<p class="text-[11px] text-gray-500 mt-1">'+t('severanceNote')+'</p></div>';
  }

  if(isPos){
    const cutoff = new Date(); cutoff.setFullYear(cutoff.getFullYear()-3);
    const cutoffStr = cutoff.toISOString().slice(0,10);
    const todayStr = new Date().toISOString().slice(0,10);
    html += '<div class="p-3.5 rounded-xl border bg-amber-50 border-amber-300 text-xs text-amber-900">';
    html += '<b>'+t('statuteTitle')+'</b><p class="mt-1 leading-relaxed">'+t('statuteBody1')+todayStr+t('statuteBody2')+'<b>'+cutoffStr+'</b>'+t('statuteBody3')+'</p></div>';
  }

  html += '<div class="text-[11px] text-gray-400 bg-gray-50 p-3.5 rounded-xl text-center border leading-relaxed">⚠️ <strong>'+t('safeZoneTitle')+'</strong> '+t('safeZoneBody')+'</div>';
  html += '</div>'; // #printArea

  html += '<button type="button" onclick="window.print()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 rounded-xl text-sm">'+t('pdfBtn')+'</button>';

  card.innerHTML = html;
}

function rrow(lab,val,sub){
  return '<div class="flex justify-between items-baseline py-1 text-sm"><span class="text-gray-600">'+lab+(sub?' <span class="text-[10px] text-gray-400">'+sub+'</span>':'')+'</span><span class="font-semibold text-gray-900">'+val+'</span></div>';
}
function warn(color,title,body){
  return '<div class="p-3.5 rounded-xl border bg-'+color+'-50 border-'+color+'-300 text-xs text-'+color+'-900"><b>'+title+'</b><p class="mt-1 leading-relaxed">'+body+'</p></div>';
}
function routingButtons(){
  return '<div class="pt-2 flex flex-wrap gap-2">'+
    '<button type="button" onclick="alert(t(\'routingBtn1Toast\'))" class="bg-trustBlue hover:bg-blue-800 text-white text-xs font-bold px-3.5 py-2.5 rounded-lg">'+t('routingBtn1')+'</button>'+
    '<button type="button" onclick="alert(t(\'routingBtn2Toast\'))" class="bg-safetyTeal hover:bg-teal-700 text-white text-xs font-bold px-3.5 py-2.5 rounded-lg">'+t('routingBtn2')+'</button>'+
    '</div>';
}

/* ==================================================================
   7. 초기화
   ================================================================== */
window.onload = function(){ renderStatic(); renderInputs(); };
</script>
</body>
</html>
